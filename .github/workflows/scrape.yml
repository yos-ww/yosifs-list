# Collects grocery prices from Rafeeq and saves them to Supabase.
# Rules: see docs/scraping-notes.md — public pages only, 1 req/s, stop if blocked.
#
# The ~130k grocery products are split into 16 slices (staples like milk & bread first),
# each about 4.5 hours of polite scraping (GitHub allows 6 h per job).
#   - Every night: one slice, rotating by date → every price refreshed about every 16 days.
#   - "full" (run by hand): all 16 slices one after another (~3 days) for the first big load.
#   - "sample" (run by hand): a few products per chain, for testing.
name: Scrape prices

on:
  # Nightly schedule is OFF until the owner has checked Rafeeq prices against Talabat / in-store.
  # schedule:
  #   - cron: "0 21 * * *" # every night at 00:00 Doha time
  workflow_dispatch:
    inputs:
      mode:
        description: "sample, common (products sold at 4+ chains), daily (one slice) or full (all 16 slices, ~3 days)"
        default: "sample"
      limit:
        description: "Products per chain in sample mode"
        default: "30"

permissions:
  contents: read

concurrency:
  group: scrape
  cancel-in-progress: false

env:
  SLICES: "16"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      slices: ${{ steps.plan.outputs.slices }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Find product pages
        run: python scrapers/rafeeq.py index
      - uses: actions/upload-artifact@v4
        with:
          name: rafeeq-index
          path: scrapers/data/rafeeq_index.json
          retention-days: 7
      - name: Decide which slices to run
        id: plan
        env:
          MODE: ${{ inputs.mode || 'daily' }}
        run: |
          case "$MODE" in
            sample) slices='["sample"]' ;;
            common) slices='["common"]' ;;
            full)   slices=$(python3 -c "import json; print(json.dumps([f'{k}/$SLICES' for k in range($SLICES)]))") ;;
            *)      k=$(( 10#$(date -u +%j) % SLICES )); slices="[\"$k/$SLICES\"]" ;;
          esac
          echo "Running: $slices"
          echo "slices=$slices" >> "$GITHUB_OUTPUT"

  scrape:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350 # GitHub's limit is 6 hours; the scraper stops itself at 320 minutes
    strategy:
      max-parallel: 1 # one at a time, so Rafeeq only ever sees ~1 request per second from us
      fail-fast: false
      matrix:
        slice: ${{ fromJSON(needs.plan.outputs.slices) }}
    env:
      SUPABASE_URL: https://tayeprbksqdopengwbfh.supabase.co # public, not a secret
      SLICE: ${{ matrix.slice }}
      LIMIT: ${{ inputs.limit || '30' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: rafeeq-index
          path: scrapers/data
      - name: Read prices
        run: |
          if [ "$SLICE" = "sample" ]; then
            python scrapers/rafeeq.py scrape --limit "$LIMIT"
          elif [ "$SLICE" = "common" ]; then
            python scrapers/rafeeq.py scrape --common 4
          else
            python scrapers/rafeeq.py scrape --slice "$SLICE" --max-minutes 320
          fi
      - name: Save to Supabase
        run: python scrapers/rafeeq.py upload
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
