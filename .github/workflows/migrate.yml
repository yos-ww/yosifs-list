# Applies database changes (supabase/migrations/*.sql) to Supabase whenever they're pushed.
# Needs the SUPABASE_DB_URL secret (Session pooler connection string, with the password filled in).
# Every migration is written to be safe to run more than once, so all of them run each time, in order.
name: Update database

on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "Applying $f"
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done
          echo "All migrations applied."
